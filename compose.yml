services:
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/aliyagabbassova/spring-cloud-config-repo.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
      SPRING_APPLICATION_NAME: config-server
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false
      SERVER_PORT: 8888
    networks:
      - my-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5


  eureka-server:
    container_name: eureka-server
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: git
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888/
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - my-network
    init: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3


  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      postgres-user:
        condition: service_started
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/users
      SPRING_DATASOURCE_USERNAME: aliya
      SPRING_DATASOURCE_PASSWORD: aliya123
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/aliyagabbassova/spring-cloud-config-repo.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
      SPRING_APPLICATION_NAME: user-service
    networks:
      - my-network

  company-service:
    build:
      context: ./company-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      postgres-company:
        condition: service_started
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-company:5432/company_db
      SPRING_DATASOURCE_USERNAME: aliya
      SPRING_DATASOURCE_PASSWORD: aliya123
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/aliyagabbassova/spring-cloud-config-repo.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
      SPRING_APPLICATION_NAME: company-service
    networks:
      - my-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/aliyagabbassova/spring-cloud-config-repo.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
    networks:
      - my-network

  postgres-user:
    image: 'postgres:latest'
    container_name: postgres-user
    environment:
      - POSTGRES_DB=users
      - POSTGRES_USER=aliya
      - POSTGRES_PASSWORD=aliya123
    ports:
      - "5432:5432"
    networks:
      - my-network
    restart: unless-stopped

  postgres-company:
    image: 'postgres:latest'
    container_name: postgres-company
    environment:
      - POSTGRES_DB=company_db
      - POSTGRES_USER=aliya
      - POSTGRES_PASSWORD=aliya123
    ports:
      - "5433:5432"
    networks:
      - my-network
    restart: unless-stopped

networks:
  my-network:
    driver: bridge
